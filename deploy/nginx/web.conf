server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite emits content-hashed files under /assets/: cache them forever, and
  # answer real 404s for chunks from older builds — returning the SPA
  # fallback HTML for a missing chunk makes the browser fail the dynamic
  # import and whites out the page.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    # The entry document and small statics (sw.js, manifest, icons) must be
    # revalidated on every load so a redeploy — and a service worker update —
    # is picked up immediately instead of from a stale cache.
    add_header Cache-Control "no-cache" always;
  }
}
